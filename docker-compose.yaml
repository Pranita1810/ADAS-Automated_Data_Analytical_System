services:
  api:
    build:
      context: .
      dockerfile: services/dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./services/config_/.env
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: pipeline/dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./pipeline/.env
    environment:
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin
    depends_on:
      - api
    volumes:
      - ./pipeline/backups/parquet_backups:/app/pipeline/backups/parquet_backups
      - ./pipeline/dags:/app/pipeline/dags
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
